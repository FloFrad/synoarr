# Projet pour Container Manager (DSM 7.2+) ou docker compose.
# Les dossiers sont montés AU MÊME CHEMIN que sur le NAS : config.ini est
# identique en natif et en Docker.
services:
  synoarr:
    build: .
    image: synoarr:latest
    container_name: synoarr
    restart: unless-stopped
    # réseau de l'hôte : Download Station reste joignable sur 127.0.0.1:5000
    network_mode: host
    environment:
      - TZ=Europe/Paris
      - SYNOARR_CONFIG=/config/config.ini
    volumes:
      - ./config:/config                       # config.ini + data/
      - /volume1/Download:/volume1/Download
      - /volume1/Vidéos:/volume1/Vidéos
