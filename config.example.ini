; ==========================================================================
;  synoarr — fichier de configuration
;  Copiez ce fichier en config.ini (python3 synoarr.py init) puis adaptez-le.
;  Lignes commençant par ; = commentaires. Après chaque modification :
;      python3 synoarr.py check
;  Astuce : n'importe quelle valeur peut aussi être donnée par variable
;  d'environnement SYNOARR_<SECTION>_<CLE>, ex. SYNOARR_DOWNLOADSTATION_PASSWORD
; ==========================================================================

[general]
; Dossier des données (base SQLite, journal). Relatif = à côté de ce fichier.
data_dir = ./data
; DEBUG pour un journal détaillé
log_level = INFO
; Fréquence de lecture de la Watchlist Plex + recherche (minutes)
watchlist_interval_minutes = 15
; Fréquence de surveillance du dossier des téléchargements (minutes)
process_interval_minutes = 2
; Délai avant de rechercher à nouveau un contenu introuvable (heures)
research_interval_hours = 6
; true = simulation complète : rien n'est envoyé à Download Station ni déplacé
dry_run = false

[plex]
; Laissez vide et lancez « python3 synoarr.py plex-login » : le jeton est alors
; enregistré automatiquement dans la base. Sinon collez votre X-Plex-Token ici.
token =
; Facultatif : votre serveur Plex local, pour rafraîchir la bibliothèque après
; chaque import (ex. http://127.0.0.1:32400). Vide = désactivé.
server_url =
server_token =

[downloadstation]
; Adresse de DSM vue depuis le NAS lui-même (laisser tel quel en général).
; En HTTPS : https://127.0.0.1:5001
url = http://127.0.0.1:5000
; Utilisateur DSM SANS double authentification (2FA), avec accès à Download
; Station et au dossier partagé ci-dessous. Conseil : créez un utilisateur dédié.
username =
password =
; Dossier partagé (et sous-dossier éventuel) où Download Station enregistre les
; torrents envoyés par synoarr. SANS "/" au début. Ex. : Download
destination = Download
; Vérifier le certificat HTTPS de DSM (false si certificat auto-signé)
verify_ssl = false
; Envoi des .torrent : file = synoarr récupère le fichier auprès de l'indexer
; et l'envoie tel quel à Download Station (comme Prowlarr) ; url = Download
; Station télécharge lui-même le lien (seulement si le lien finit par .torrent).
; Dans les deux cas, rien n'est modifié.
send_mode = file
; Quand l'indexer propose les deux : torrent = envoyer le fichier .torrent ;
; magnet = envoyer d'abord le lien magnet (comme le fait Prowlarr).
prefer = torrent
; Facultatif : trackers publics à ajouter aux liens magnet qui en ont moins de
; 2 (séparés par des virgules). Vide = liens magnet envoyés tels quels.
extra_trackers =
; Abandonner un téléchargement toujours sans source après X heures (la release
; est mise sur liste noire et une autre est cherchée). 0 = jamais.
stalled_hours = 6

[paths]
; Chemin complet du dossier ci-dessus vu par synoarr (doit correspondre à
; [downloadstation] destination). Natif : /volume1/Download
download_dir = /volume1/Download
; Destinations finales (créées si besoin). Vérifiez le nom exact de votre
; dossier partagé dans File Station > clic droit > Propriétés > Emplacement.
movies_dir = /volume1/video/Films
series_dir = /volume1/video/TvShows
; move (déplacer, comme Filebot --action move), copy, ou hardlink (lien dur :
; garde le partage du torrent sans prendre de place, même volume obligatoire)
action = move
; Un téléchargement n'est traité que s'il n'a pas été modifié depuis X minutes
min_age_minutes = 5
; Supprimer la tâche de Download Station après l'import (les fichiers déjà
; déplacés ne sont jamais supprimés)
remove_task_after_import = true
; Supprimer le dossier source restant (nfo, sample, txt...) après un import
delete_leftovers = true
; true = ne traiter que les téléchargements envoyés par synoarr
; false = traiter aussi tout ce que vous ajoutez à la main dans le dossier
only_known_downloads = false

[naming]
; Format des noms (sans extension), à la manière de Filebot. Variables :
;   films  : {title} {year} {collection} {imdb} {tmdb} {resolution}
;   séries : {show} {season} {episode} {episode_title} {year} {tvdb} {resolution}
; {season:02d} = numéro sur 2 chiffres. "/" crée des sous-dossiers.
; Films : video/Films/Titre (Année).mkv
movie_format = {title} ({year})
; Films d'une collection (clé TMDb nécessaire) : video/Films/Nom Collection/Titre (Année).mkv
movie_collection_format = {collection}/{title} ({year})
; Séries : video/TvShows/Série/Saison 01/Série - S01E02 - Titre épisode.mkv
; (titre de l'épisode : fourni par Plex, ou par TMDb ; absent => "Série - S01E02.mkv")
series_format = {show}/Saison {season:02d}/{show} - S{season:02d}E{episode:02d} - {episode_title}

[quality]
; Résolutions acceptées, de la préférée à la moins préférée
resolutions = 1080p, 720p
; true = accepter aussi les autres résolutions (score plus faible)
allow_other_resolutions = false
; Langues audio acceptées pour les films et séries (en = anglais/VO,
; fr = français, vostfr = VO sous-titrée français ; MULTI accepté)
languages = en
; Langues audio pour l'animation / les dessins animés (genre « Animation »)
languages_animation = fr
; Nombre minimum de sources (seeders) quand l'indexer le fournit
min_seeders = 1
; Tailles acceptées
min_size_mb = 100
max_size_gb_movie = 25
max_size_gb_episode = 6
max_size_gb_season = 60
; Mots qui font rejeter une release
reject_words = cam, camrip, hdcam, ts, telesync, hdts, tc, telecine, screener, scr, workprint
; Mots qui donnent un bonus (ex. : remux, hdr). Par défaut : sous-titres inclus
prefer_words = multisubs, multi-subs, subs

[series]
; all = toute la série ; future = seulement les épisodes diffusés après
; l'ajout à la Watchlist ; latest_season = seulement la dernière saison
monitor = all
; Chercher d'abord les saisons complètes quand plusieurs épisodes manquent
season_packs = true

[tmdb]
; Recommandé : clé API TMDb (gratuite sur themoviedb.org > Paramètres > API).
; Nécessaire pour les dossiers de collections, et améliore les titres d'épisodes,
; la détection de l'animation et le renommage des fichiers ajoutés à la main.
api_key =
language = en-US

[web]
; Mini interface web : http://IP-DU-NAS:8778
enabled = true
host = 0.0.0.0
port = 8778
; Renseignez les deux pour protéger l'interface par mot de passe
username =
password =

[prowlarr]
; Facultatif : synchronisation automatique des indexers de Prowlarr.
; Prowlarr OU Jackett ([jackett] ci-dessous) : l'un ou l'autre, pas les deux.
; Le plus simple : utilisez « Importer depuis Prowlarr » (onglet Indexers) une
; fois ; l'adresse et la clé sont alors mémorisées et ces lignes restent vides.
; Ensuite, un indexer ajouté dans Prowlarr apparaît tout seul dans synoarr, un
; indexer supprimé ou désactivé dans Prowlarr est désactivé, et les priorités
; suivent celles de Prowlarr.
url =
api_key =
; Fréquence de la synchronisation (heures). 0 = jamais automatiquement.
sync_interval_hours = 6

[jackett]
; Facultatif, à la place de Prowlarr (même principe). Le plus simple :
; « Importer depuis Jackett » (onglet Indexers) une fois, ces lignes restent
; vides. Fréquence : [prowlarr] sync_interval_hours.
url =
api_key =
